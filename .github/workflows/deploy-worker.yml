name: Deploy download counter (Cloudflare Worker)

# Deploys worker/ (the D1-backed download counter behind /api/downloads/*).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the D1
# database id filled in worker/wrangler.toml. Skips cleanly until those exist.

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping worker deploy."
            exit 0
          fi
          if grep -q REPLACE_WITH_D1_DATABASE_ID wrangler.toml; then
            echo "::notice::D1 database_id not set in worker/wrangler.toml; skipping worker deploy."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Apply D1 schema
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes wrangler@4 d1 execute onyachamp-stats --remote --file=schema.sql

      - name: Deploy worker
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes wrangler@4 deploy
